name: Bug report
description: Report a reproducible RepoRecall problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the query and what you expected, but never include credentials or private repository data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Search for ...\n2. Open ..."
    validations:
      required: true
